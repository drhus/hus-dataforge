template: poetry
poet:
  name_ar: حذيفة العرجي
  aldiwan_slug: alarje
  telegram_channel: el_arje
  x_handle: al_arje
sources:
- name: aldiwan-alarje
  type: list_detail
  list_url: https://www.aldiwan.net/cat-poet-alarje
  list_link_selector: a[href^="poem"]
  base_url: https://www.aldiwan.net/
  rate_limit_sec: 3.5
  max_records: 3
  record_selector: body
  fields:
    title:
      selector: h2
      attr: text
    verses:
      selector: h3
      attr: text
      multi: true
      join_with: '

        '
    poet_link:
      selector: a[href*="cat-poet-"]
      attr: href
- name: telegram-el-arje
  type: telegram_web
  channel: el_arje
  rate_limit_sec: 1.5
  max_records: 50
