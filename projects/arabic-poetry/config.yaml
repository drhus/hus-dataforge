template: poetry
poets:
- slug: hudhayfah-alarje
  manifest: poets/hudhayfah-alarje.yaml
- slug: anas-aldaghim
  manifest: poets/anas-aldaghim.yaml
- slug: nizar-qabbani
  manifest: poets/nizar-qabbani.yaml
sources:
- name: aldiwan-alarje
  type: list_detail
  poet: hudhayfah-alarje
  list_url: https://www.aldiwan.net/cat-poet-alarje
  list_link_selector: a[href^="poem"]
  base_url: https://www.aldiwan.net/
  rate_limit_sec: 3.5
  record_selector: body
  fields:
    title:
      selector: h2
      attr: text
    verses:
      selector: div.bet-1
      attr: text
- name: aldiwan-qabbani
  type: list_detail
  poet: nizar-qabbani
  list_url: https://www.aldiwan.net/cat-poet-nizar-qabbani
  list_link_selector: a[href^="poem"]
  base_url: https://www.aldiwan.net/
  rate_limit_sec: 3.5
  record_selector: body
  fields:
    title:
      selector: h2
      attr: text
    verses:
      selector: div.bet-1
      attr: text
- name: telegram-el-arje
  type: telegram_web
  poet: hudhayfah-alarje
  channel: el_arje
  rate_limit_sec: 1.0
  max_records: 5000
  categorize:
  - text_contains_any:
    - '#حذيفة_العرجي'
    - '#قصيدة_جديدة'
    - '#قال_حذيفة'
    set_category: poetry
  primary_category: poetry
  fallback_category: commentary
- name: telegram-eqbal-anas
  type: telegram_web
  poet: anas-aldaghim
  channel: EqbalAnas
  rate_limit_sec: 1.0
  max_records: 5000
  categorize:
  - text_contains_any:
    - '#أنس_الدغيم'
    - '#منازل_القصيد'
    - '#مع_أنس'
    set_category: poetry
  primary_category: poetry
  fallback_category: commentary
- name: telegram-nizar-aggregator
  type: telegram_web
  poet: nizar-qabbani
  channel: nizar_alQabbani
  rate_limit_sec: 1.0
  max_records: 2000
  categorize: []
  primary_category: poetry
  fallback_category: commentary
- name: telegram-nizar-aggregator-mtproto-tail
  type: telegram_mtproto
  poet: nizar-qabbani
  channel: nizar_alQabbani
  max_records: 5000
  extend_below_source: telegram-nizar-aggregator
  categorize: []
  primary_category: poetry
  fallback_category: commentary
