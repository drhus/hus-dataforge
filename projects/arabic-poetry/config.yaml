- name: telegram-el-arje
  type: telegram_web
  poet: hudhayfah-alarje
  channel: el_arje
  rate_limit_sec: 1.0
  max_records: 5000
  categorize:
  - text_contains_any:
    - '#حذيفة_العرجي'
    - '#قصيدة_جديدة'
    - '#قال_حذيفة'
    set_category: poetry
  primary_category: poetry
  fallback_category: commentary
- name: telegram-eqbal-anas
  type: telegram_web
  poet: anas-aldaghim
  channel: EqbalAnas
  rate_limit_sec: 1.0
  max_records: 5000
  categorize:
  - text_contains_any:
    - '#أنس_الدغيم'
    - '#منازل_القصيد'
    - '#مع_أنس'
    set_category: poetry
  primary_category: poetry
  fallback_category: commentary
  clean_rules:
    title_ops: []
    text_ops: []
    filter_min_chars: 20
    filter_min_lines: 0
    filter_min_arabic_ratio: 0.4
    drop_if_url_dominated: true
- name: telegram-nizar-aggregator
