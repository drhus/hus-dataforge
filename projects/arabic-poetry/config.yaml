template: poetry
poets:
- slug: hudhayfah-alarje
  manifest: poets/hudhayfah-alarje.yaml
- slug: anas-aldaghim
  manifest: poets/anas-aldaghim.yaml
sources:
- name: aldiwan-alarje
  type: list_detail
  list_url: https://www.aldiwan.net/cat-poet-alarje
  list_link_selector: a[href^="poem"]
  base_url: https://www.aldiwan.net/
  rate_limit_sec: 3.5
  record_selector: body
  fields:
    title:
      selector: h2
      attr: text
    verses:
      selector: h3
      attr: text
      multi: true
      join_with: '

        '
- name: telegram-el-arje
  type: telegram_web
  channel: el_arje
  rate_limit_sec: 1.5
  max_records: 500
- name: telegram-eqbal-anas
  type: telegram_web
  channel: EqbalAnas
  rate_limit_sec: 1.5
  max_records: 500
