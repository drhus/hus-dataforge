name_ar: تميم البرغوثي
name_en: Tamim al-Barghouti
aliases:
  - تميم البرغوثي
  - تميم برغوثي
country: Palestine
born: 1977
genre: colloquial
dialect: palestinian
notes: |
  Bilingual poet (Fusha + Palestinian/Egyptian colloquial). First
  diwan "ميجنا" (1999) entirely in Palestinian colloquial. "في
  القدس" (2007) recited on أمير الشعراء went viral. Also writes
  in Egyptian colloquial ("يا مصر هانت" 2012).
sources:
