name_ar: طلال حيدر
name_en: Talal Haidar
aliases:
  - طلال حيدر
country: Lebanon
born: 1937
genre: zajal
dialect: lebanese
notes: |
  Iconic Lebanese poet writing in Baalbeki dialect; lyrics for
  Fairuz ("وحدن", "بكتب اسمك يا حبيبي"), Marcel Khalife and
  others. Two-time Said Akl Prize winner.
