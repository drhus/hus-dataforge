name_ar: سعيد عقل
name_en: Said Akl
aliases:
  - سعيد عقل
country: Lebanon
born: 1911
died: 2014
genre: zajal
dialect: lebanese
notes: |
  Towering figure of Lebanese letters; wrote both Fusha and Lebanese
  colloquial; famously championed writing Lebanese in the Latin
  alphabet. Founded the "Cadmus" magazine. Influenced an entire
  generation of zajal and dialect writers.
